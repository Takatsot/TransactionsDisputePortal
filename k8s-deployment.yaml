# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: transactionsdisputeportal
---
# ConfigMap for application settings
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: transactionsdisputeportal
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  JwtSettings__Issuer: "TransactionsDisputePortal"
  JwtSettings__Audience: "TransactionsDisputePortalUsers"
  ConnectionStrings__DefaultConnection: "Server=sqlserver-service;Database=TransactionsDisputePortalDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;"
---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: transactionsdisputeportal
type: Opaque
stringData:
  SA_PASSWORD: "YourStrong@Passw0rd"
  JWT_SECRET: "YourSuperSecretKeyThatIsAtLeast32CharactersLong123"
---
# SQL Server StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver
  namespace: transactionsdisputeportal
spec:
  serviceName: sqlserver-service
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
          name: mssql
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: SA_PASSWORD
        - name: MSSQL_PID
          value: "Developer"
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /opt/mssql-tools18/bin/sqlcmd
            - -S
            - localhost
            - -U
            - sa
            - -P
            - YourStrong@Passw0rd
            - -C
            - -Q
            - SELECT 1
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /opt/mssql-tools18/bin/sqlcmd
            - -S
            - localhost
            - -U
            - sa
            - -P
            - YourStrong@Passw0rd
            - -C
            - -Q
            - SELECT 1
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: mssql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
# SQL Server Service
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
  namespace: transactionsdisputeportal
spec:
  selector:
    app: sqlserver
  ports:
  - port: 1433
    targetPort: 1433
    protocol: TCP
  type: ClusterIP
---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: transactionsdisputeportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: transactionsdisputeportal-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ConnectionStrings__DefaultConnection
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: JwtSettings__Issuer
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: JwtSettings__Audience
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: uploads
        emptyDir: {}
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: transactionsdisputeportal
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
---
# UI Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: transactionsdisputeportal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: transactionsdisputeportal-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        env:
        - name: VITE_API_URL
          value: "http://localhost:5000"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
# UI Service
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: transactionsdisputeportal
spec:
  selector:
    app: ui
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: LoadBalancer
---
# Ingress (optional, for Rancher Desktop with Traefik)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: transactionsdisputeportal
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
  - host: transactionsdisputeportal.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ui-service
            port:
              number: 80
