name: UI - Build, Test & Deploy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'TransactionsDisputePortal.UI/**'
      - '.github/workflows/ui-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'TransactionsDisputePortal.UI/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ui
  NODE_VERSION: '20.x'

jobs:
  # Build and Test Job
  build-and-test:
    name: Build & Test UI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: TransactionsDisputePortal.UI/package-lock.json
        
    - name: Install dependencies
      working-directory: ./TransactionsDisputePortal.UI
      run: npm ci
      
    - name: Lint code
      working-directory: ./TransactionsDisputePortal.UI
      run: npm run lint --if-present
      
    - name: Run tests
      working-directory: ./TransactionsDisputePortal.UI
      run: npm test --if-present -- --coverage --watchAll=false
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./TransactionsDisputePortal.UI/coverage
        flags: ui
        
    - name: Build application
      working-directory: ./TransactionsDisputePortal.UI
      run: npm run build
      env:
        VITE_API_URL: ${{ vars.VITE_API_URL || 'http://localhost:5000' }}
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ui-build
        path: TransactionsDisputePortal.UI/dist
        retention-days: 7
        
  # Docker Build Job
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./TransactionsDisputePortal.UI
        file: ./TransactionsDisputePortal.UI/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        build-args: |
          VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:5000' }}
          
  # Security Scan Job
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Install dependencies
      working-directory: ./TransactionsDisputePortal.UI
      run: npm ci
      
    - name: Run npm audit
      working-directory: ./TransactionsDisputePortal.UI
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high
        
  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.transactionsdisputeportal.com
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Kubernetes (Staging)
      run: |
        echo "Deploying UI to staging environment..."
        # Add your Kubernetes deployment commands here
        # kubectl set image deployment/ui ui=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        
  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://transactionsdisputeportal.com
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Kubernetes (Production)
      run: |
        echo "Deploying UI to production environment..."
        # Add your Kubernetes deployment commands here
        # kubectl set image deployment/ui ui=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
