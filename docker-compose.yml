services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: transactionsdisputeportal-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - transactionsdisputeportal-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # .NET API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: transactionsdisputeportal-api:latest
    container_name: transactionsdisputeportal-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TransactionsDisputePortalDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - JwtSettings__SecretKey=YourSuperSecretKeyThatIsAtLeast32CharactersLong123
      - JwtSettings__Issuer=TransactionsDisputePortal
      - JwtSettings__Audience=TransactionsDisputePortalUsers
      - JwtSettings__ExpiryHours=24
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - transactionsdisputeportal-network
    volumes:
      - api-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # React UI
  ui:
    build:
      context: ./TransactionsDisputePortal.UI
      dockerfile: Dockerfile
    image: transactionsdisputeportal-ui:latest
    container_name: transactionsdisputeportal-ui
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - transactionsdisputeportal-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  transactionsdisputeportal-network:
    driver: bridge

volumes:
  sqlserver-data:
    driver: local
  api-uploads:
    driver: local
